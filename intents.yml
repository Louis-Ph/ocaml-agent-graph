      planner_agent.intent:
        purpose: ''
        design_decisions:
        - 1. Open `Lwt.Infix` so the asynchronous result mapping reads naturally.
        - 2. Define a local maximum number of plan steps.
        - 3. Expose the agent id as `Planner`.
        - 4. Keep a small local fallback plan path so the agent can still normalize unusable output.
        - 5. Provide helpers that split raw text, trim numbering prefixes, and normalize multi-line plan output.
        - 6. Provide a local deterministic `plan_from_text` fallback based on text segmentation.
        - 7. Build a planner-specific LLM instruction that asks for short execution steps with no extra commentary.
        - 8. Convert the LLM usage information into the framework metrics and notes format.
        - 9. In `run`, accept only `Text` payloads.
        - 10. Read the planner profile from the runtime services configuration.
        - 11. Call `Llm_bulkhead_client.invoke_chat` so the planner goes through BulkheadLM and the configured provider route.
        - '12. Parse the LLM text into normalized `Stage N: ...` lines.'
        - 13. Fall back to the local planning heuristic if the model returns no usable lines.
        - 14. Return a typed `Plan` payload plus metrics and notes.
        - 15. Reject unsupported payload kinds with a typed error payload.
      default_agents.ml:
        purpose: ''
        domain_concepts: []
        dependencies: []
        operations:
        - all
        invariants: []
      default_agents.intent:
        purpose: ''
        design_decisions:
        - 1. Build one list named `all` that contains the packaged built-in agents.
        - 2. Keep that list explicit so the default system has a visible and auditable composition.
        - 3. Create a new registry with a small initial capacity.
        - 4. Register each built-in agent into that registry.
        - 5. Return the registry so the rest of the system can run without extra wiring.
      agent_intf.intent:
        purpose: ''
        design_decisions:
        - '1. Define `run_result` as one precise shape for every agent output: payload, metrics, and notes.'
        - 2. Define the module signature `S` so every agent exposes an `id` and a `run` function.
        - 3. Require `run` to receive the injected runtime services first, because agents now depend on the shared LLM gateway
          layer.
        - 4. Require `run` to receive the typed context and typed payload after the services.
        - 5. Require `run` to return an `Lwt` promise so agents fit into the asynchronous runtime.
        - 6. Define `packed` so different agent modules can be stored together in the registry.
      validator_agent.intent:
        purpose: ''
        design_decisions:
        - 1. Open `Lwt.Infix` so asynchronous result mapping stays linear.
        - 2. Keep one local fallback size limit for deterministic validation.
        - 3. Expose the agent id as `Validator`.
        - 4. Provide local fallback validators for raw text and plan payloads.
