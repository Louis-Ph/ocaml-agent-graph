          injected LLM services while the engine still owns policy.
        - 7. Ask the registry for the requested agent module.
        - 8. If the agent is missing, log an error and return a typed failure item instead of crashing the runtime.
        - 9. If the agent exists, capture the start time so latency can be measured after execution.
        - 10. Build a retry policy from the runtime configuration.
        - 11. Log the fact that this agent is about to run and on what kind of payload.
