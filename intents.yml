  test:
    test_agent_graph.intent:
      purpose: ''
      design_decisions:
      - 1. Open the public `Agent_graph` API instead of reaching into private implementation details.
      - 2. Build a deterministic runtime configuration, including one LLM profile per agent.
      - 3. Build the default registry once for all tests.
      - 4. Define `has_prefix` as a tiny helper for checking summarizer output.
      - 5. Define `make_services` to build a real BulkheadLM runtime store backed by `Bulkhead_lm.Provider_mock`.
      - 6. Configure BulkheadLM routes and a test virtual key so the graph still goes through the real `Config -> Runtime_state
        -> Router` path.
      - 7. Wrap that mocked BulkheadLM runtime inside `Runtime.Services`.
      - 8. Define `run` as a synchronous helper that creates a fresh context and executes the orchestrator with injected services.
      - 9. In `test_short_text_path`, mock the summarizer route and run the graph on a short text.
      - 10. Assert that the final payload is summarized text generated from the mocked LLM response.
      - 11. Assert that only one step happened and that the summarizer completed.
      - 12. In `test_long_text_parallel_path`, mock the planner, summarizer, and validator routes.
      - 13. Run the graph on a long text so it goes through planning and parallel fan-out.
      - 14. Assert that the final payload is a batch with two aggregated parallel results.
      - 15. Assert that the planner completed and that both `summarizer` and `validator` are present in the batch.
      - 16. Assert that the rendered batch still contains the mocked validation content.
      - 17. Register both tests with Alcotest under clear suite names.
    test_demos.ml:
      purpose: ''
      domain_concepts: []
      dependencies:
      - Agent_graph
      - Yojson
      operations: []
      invariants: []
    test_agent_graph.ml:
      purpose: ''
      domain_concepts:
      - captured_bridge_request
      dependencies:
      - Agent_graph
      - Lwt
      operations:
      - participant
      - local_participant
      - remote_participant
      - participant
      - participant
      invariants:
      - Uses explicit result types for error handling
      - Async execution via Lwt promises
    dune:
      purpose: 'Build configuration: dune'
      build_system: Dune
      targets:
      - test_agent_graph
      - test_client
      - test_demos
      - test_protocol
      - test_coordination
    test_client.ml:
      purpose: ''
      domain_concepts:
      - captured_gateway_request
      dependencies:
      - Agent_graph
      - Lwt
      operations:
      - attachment
      - attachment
      - request
      invariants:
      - Uses explicit result types for error handling
      - Async execution via Lwt promises
    test_coordination.ml:
      purpose: "Tests for L1-COORDINATION (Consensus) and L2-COMPOSITION (Pipeline).\n   Both layers are exercised through\
        \ mock LLM services so that tests run\n   offline and remain deterministic."
      domain_concepts: []
      dependencies:
      - Agent_graph
      - Lwt
      operations: []
      invariants:
      - Uses explicit result types for error handling
      - Async execution via Lwt promises
    test_protocol.ml:
      purpose: "Tests for L0-PROTOCOL (Envelope, Capability) and L0.5-AUDIT (Audit chain).\n   These are pure-function tests\
        \ — no LLM calls, no Lwt, no mocks."
      domain_concepts: []
      dependencies:
      - Agent_graph
      operations:
      - m
      invariants:
      - Async execution via Lwt promises
      - Tamper-evident audit logging
      - Permission-based access control
